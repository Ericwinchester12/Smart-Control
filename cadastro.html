<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelaHome - Cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body>

    <!-- tela de escolha inicial -->
    <div id="passo1" class="container-central">
        <div class="caixa-selecao">
            <div class="opcao">
                <label for="tipo-prestador">Prestador<br>de serviços</label>
                <input type="radio" id="tipo-prestador" name="tipo" onclick="abrirPrestador()">
            </div>
            <div class="opcao">
                <input type="radio" id="tipo-cliente" name="tipo" onclick="abrirCliente()">
                <label for="tipo-cliente">Cliente</label>
            </div>
        </div>
    </div>

    <!-- form do trabalhador que fica escondido -->
    <div id="form-prestador" style="display: none;" class="container-form">
        <form action="index.html">
            <div class="campo">
                <label for="nome-p">Nome completo</label>
                <input type="text" id="nome-p" required>
            </div>
            
            <div class="campo">
                <label for="cpf-p">Cpf</label>
                <input type="text" id="cpf-p" required>
            </div>

            <div class="campo">
                <label for="mei">Mei</label>
                <input type="text" id="mei">
            </div>

            <div class="campo">
                <label for="servico">Serviço prestado</label>
                <input type="text" id="servico" required>
            </div>

            <div class="campo">
                <label for="credenciais">credenciais</label>
                <textarea id="credenciais" rows="3"></textarea>
            </div>

            <div class="campo-check">
                <input type="checkbox" id="sem-credencial">
                <label for="sem-credencial">não tenho credenciais</label>
            </div>

            <div class="campo">
                <label>experiência</label>
                <div class="radios-inline">
                    <input type="radio" id="exp-sim" name="experiencia" value="sim">
                    <label for="exp-sim">sim</label>
                    
                    <input type="radio" id="exp-nao" name="experiencia" value="nao">
                    <label for="exp-nao">não</label>
                </div>
            </div>

            <div class="campo">
                <label for="tempo-exp">quanto tempo?</label>
                <input type="text" id="tempo-exp">
            </div>

            <div class="campo">
                <label for="email-p">email</label>
                <input type="email" id="email-p" required>
            </div>

            <div class="campo">
                <label for="senha-p">senha</label>
                <input type="password" id="senha-p" required>
            </div>

            <div class="botoes">
                <a href="index.html" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>
        </form>
    </div>

    <!-- form do cliente que fica escondido -->
    <div id="form-cliente" style="display: none;" class="container-form">
        <form action="index.html">
            <div class="campo">
                <label for="nome-c">Nome completo</label>
                <input type="text" id="nome-c" required>
            </div>

            <div class="campo">
                <label for="cpf-c">Cpf</label>
                <input type="text" id="cpf-c" required>
            </div>

            <div class="campo">
                <label for="cep">Cep</label>
                <input type="text" id="cep" required>
            </div>

            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" required>
            </div>

            <div class="campo">
                <label for="rua">Rua</label>
                <input type="text" id="rua" required>
            </div>

            <div class="campo">
                <label for="numero">Numero</label>
                <input type="text" id="numero" required>
            </div>

            <div class="campo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento">
            </div>

            <div class="campo">
                <label for="email-c">email</label>
                <input type="email" id="email-c" required>
            </div>

            <div class="campo">
                <label for="senha-c">senha</label>
                <input type="password" id="senha-c" required>
            </div>

            <div class="botoes">
                <a href="index.html" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>
        </form>
    </div>

    <!-- js simples so pra trocar as telas de cadastro -->
    <script>
        function abrirPrestador() {
            document.getElementById('passo1').style.display = 'none';
            document.getElementById('form-prestador').style.display = 'block';
        }

        function abrirCliente() {
            document.getElementById('passo1').style.display = 'none';
            document.getElementById('form-cliente').style.display = 'block';
        }
    </script>
</body>
</html>
