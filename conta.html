<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização de Conta</title>
    <link rel="stylesheet" href="assets/css/conta.css">
</head>

<body>

    <div class="cabecalho">
        <a href="dashboard.html" style="color:white; text-decoration:none; float:left; font-size:16px;">&lt; Voltar</a>
        Minha Conta
    </div>

    <div class="foto-perfil" aria-label="Foto de perfil">
        <svg class="foto-perfil-icon" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="1.5"
            aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </div>

    <label for="input-nome">Nome completo</label>
    <input type="text" id="input-nome" class="campo-info" value="Nome referencia">

    <label for="input-email">Email</label>
    <input type="email" id="input-email" class="campo-info" value="emailreferencia@gmail.com">

    <label for="input-cpf">CPF</label>
    <input type="text" id="input-cpf" class="campo-info" value="123.456.789-00">

    <div style="display: flex; gap: 15px; margin-top: 20px; justify-content: center; width: 85%;">
        <button type="button" id="btn-salvar" class="botao"
            style="background-color: #72577C; color: #FFFFFF;">Salvar</button>
        <button type="button" class="botao" onclick="window.location.href='dashboard.html'">Voltar</button>
    </div>

    <script src="assets/js/boasvindas.js"></script>
    <script src="assets/js/darkmode.js"></script>
    <script src="assets/js/menuburguer.js"></script>
    <script src="assets/js/conta.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
