<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização de Conta</title>
    <link rel="stylesheet" href="assets/css/conta.css">
</head>
<body>

    <div class="cabecalho">
        <!-- Link para voltar pro dashboard -->
        <a href="dashboard.html" style="color:white; text-decoration:none; float:left; font-size:16px;">&lt; Voltar</a>
        Minha Conta
    </div>

    <div class="foto-perfil" aria-label="Foto de perfil">
        <svg class="foto-perfil-icon" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="1.5" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </div>

    <label>Nome completo</label>
    <input type="text" class="campo-info" value="Ágata Quadros" readonly>

    <label>Email</label>
    <input type="email" class="campo-info" value="emailreferencia@gmail.com" readonly>

    <label>CPF</label>
    <input type="text" class="campo-info" value="123.456.789-00" readonly>

    <button class="botao" onclick="window.location.href='dashboard.html'">Voltar</button>

</body>
</html>
